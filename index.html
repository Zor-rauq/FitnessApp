<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SÈCHE LOG — Versions</title>
    <style>
      :root {
        --bg: #14130F;
        --surface: #1E1C17;
        --border: #34312A;
        --text: #EDEAE2;
        --muted: #9C978A;
        --rust: #C1440E;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      .panel {
        width: min(92vw, 680px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 22px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(1.3rem, 3vw, 2rem);
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      .link-list {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }
      a {
        display: block;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        background: rgba(255,255,255,0.02);
      }
      a strong {
        color: var(--rust);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>SÈCHE LOG</h1>
      <p>Cette page sert de portail vers les versions publiées.</p>

      <div class="link-list">
        <a href="./seche-log.html"><strong>Version stable</strong> — production sur la branche principale</a>
        <a id="branchPreviewLink" href="#" aria-disabled="true"><strong>Preview de branche</strong> — détection automatique</a>
      </div>

      <p id="previewInfo">Les prévisualisations des branches de travail sont publiées dans un sous-dossier de type <code>/preview/feature-name/</code>.</p>
    </div>

    <script>
      (function () {
        const previewLink = document.getElementById('branchPreviewLink');
        const previewInfo = document.getElementById('previewInfo');

        const currentPath = window.location.pathname.replace(/index\.html?$/, '');
        const parts = currentPath.split('/').filter(Boolean);
        const previewIndex = parts.indexOf('preview');
        const branchFromPath = previewIndex >= 0 && parts[previewIndex + 1]
          ? decodeURIComponent(parts[previewIndex + 1])
          : null;

        function applyKnownLink(url, label) {
          previewLink.href = url;
          previewLink.setAttribute('aria-disabled', 'false');
          previewLink.innerHTML = '<strong>Preview de branche</strong> — ' + label;
        }

        fetch('./preview-meta.json', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('No preview metadata');
            return response.json();
          })
          .then(function (meta) {
            if (!meta || !meta.path || meta.path === '.') {
              if (branchFromPath) {
                applyKnownLink('./' + branchFromPath + '/seche-log.html', 'branche détectée : ' + branchFromPath);
                previewInfo.textContent = 'Cette page est servie depuis une preview de branche.';
              } else {
                previewLink.style.display = 'none';
                previewInfo.textContent = 'Aucune preview de branche active sur cette page. Ouvrez une URL de type /preview/<nom-de-branche>/ .';
              }
              return;
            }

            const target = new URL(meta.path + '/seche-log.html', window.location.href).toString();
            applyKnownLink(target, 'branche : ' + (meta.branch || 'inconnue'));
            previewInfo.textContent = 'Preview active détectée automatiquement depuis le déploiement actuel.';
          })
          .catch(function () {
            if (branchFromPath) {
              applyKnownLink('./' + branchFromPath + '/seche-log.html', 'branche détectée : ' + branchFromPath);
              previewInfo.textContent = 'Preview branch détectée automatiquement dans l’URL.';
            } else {
              previewLink.style.display = 'none';
              previewInfo.textContent = 'Aucune preview de branche active sur cette page. Ouvrez une URL de type /preview/<nom-de-branche>/ .';
            }
          });
      })();
    </script>
  </body>
</html>
