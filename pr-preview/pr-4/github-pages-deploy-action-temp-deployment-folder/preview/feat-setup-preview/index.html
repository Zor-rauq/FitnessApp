<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SÈCHE LOG — Versions</title>
    <style>
      :root {
        --bg: #14130F;
        --surface: #1E1C17;
        --border: #34312A;
        --text: #EDEAE2;
        --muted: #9C978A;
        --rust: #C1440E;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
      }
      .panel {
        width: min(92vw, 680px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 22px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(1.3rem, 3vw, 2rem);
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      .link-list {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }
      a {
        display: block;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        background: rgba(255,255,255,0.02);
      }
      a strong {
        color: var(--rust);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>SÈCHE LOG</h1>
      <p>Cette page sert de portail vers les versions publiées.</p>

      <div class="link-list">
        <a href="./seche-log.html"><strong>Version stable</strong> — production sur la branche principale</a>
        <a href="./preview/<nom-de-branche>/seche-log.html"><strong>Preview de branche</strong> — exemple de version de feature</a>
      </div>

      <p>Les prévisualisations des branches de travail sont publiées dans un sous-dossier de type <code>/preview/feature-name/</code>.</p>
    </div>
  </body>
</html>
