<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SÈCHE LOG — Versions</title>
    <style>
      :root {
        --bg: #14130F;
        --surface: #1E1C17;
        --surface-alt: #201d18;
        --border: #34312A;
        --text: #EDEAE2;
        --muted: #9C978A;
        --rust: #C1440E;
        --rust-soft: rgba(193, 68, 14, 0.14);
        --green: #5bb176;
        --green-soft: rgba(91, 177, 118, 0.16);
        --amber: #d7a04c;
      }
      :root[data-theme="light"] {
        --bg: #F5F3EE;
        --surface: #FFFFFF;
        --surface-alt: #F0EDE6;
        --border: #DEDAD0;
        --text: #211F1A;
        --muted: #6B6658;
        --rust: #B03D0C;
        --rust-soft: rgba(176, 61, 12, 0.10);
        --green: #2F8F52;
        --green-soft: rgba(47, 143, 82, 0.12);
        --amber: #A66A16;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .panel {
        width: min(92vw, 760px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 22px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.2);
      }
      .status-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface-alt);
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 700;
      }
      .status-badge.stable {
        background: var(--green-soft);
        border: 1px solid var(--green);
        color: var(--green);
      }
      .status-badge.preview {
        background: var(--rust-soft);
        border: 1px solid var(--rust);
        color: var(--rust);
      }
      .status-meta {
        color: var(--muted);
        font-size: 12px;
      }
      .status-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--text);
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .theme-toggle:hover {
        border-color: var(--rust);
        transform: translateY(-1px);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.3rem, 3vw, 2rem);
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }
      .link-list {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }
      a {
        display: block;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        background: rgba(255,255,255,0.02);
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      a:hover {
        transform: translateY(-1px);
        border-color: var(--rust);
      }
      a strong {
        color: var(--rust);
      }
      .branch-info {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        color: var(--text);
        font-size: 12px;
      }
      .branch-info span {
        color: var(--amber);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="status-banner">
        <div id="statusBadge" class="status-badge stable">Version stable</div>
        <div class="status-right">
          <div id="statusMeta" class="status-meta">DÉPLOIEMENT RÉEL</div>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Changer de thème">🌙 Sombre</button>
        </div>
      </div>

      <h1>SÈCHE LOG</h1>
      <p>Cette page sert de portail vers les versions publiées.</p>

      <div class="link-list">
        <a href="./seche-log.html"><strong>Version stable</strong> — production sur la branche principale</a>
      </div>

      <p id="previewInfo">Les prévisualisations de pull request sont publiées dans un sous-dossier de type <code>/pr-preview/pr-&lt;numero&gt;/</code>.</p>
      <div class="branch-info">Environnement actuel : <span id="envName">stable</span></div>
    </div>

    <script>
      (function () {
        const themeToggle = document.getElementById('themeToggle');
        const THEME_KEY = 'seche-log-theme';

        function applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          themeToggle.textContent = theme === 'light' ? '☀️ Clair' : '🌙 Sombre';
        }

        applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');

        themeToggle.addEventListener('click', function () {
          const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          localStorage.setItem(THEME_KEY, next);
          applyTheme(next);
        });
      })();

      (function () {
        const previewInfo = document.getElementById('previewInfo');
        const statusBadge = document.getElementById('statusBadge');
        const statusMeta = document.getElementById('statusMeta');
        const envName = document.getElementById('envName');

        const parts = window.location.pathname.split('/').filter(Boolean);
        const prIndex = parts.indexOf('pr-preview');
        const prLabel = prIndex >= 0 && parts[prIndex + 1] ? decodeURIComponent(parts[prIndex + 1]) : null;

        if (prLabel) {
          statusBadge.className = 'status-badge preview';
          statusBadge.textContent = 'Preview';
          statusMeta.textContent = 'VERSION DE TEST';
          envName.textContent = prLabel;
          previewInfo.textContent = 'Cette page est servie depuis une preview de pull request (' + prLabel + ').';
        } else {
          statusBadge.className = 'status-badge stable';
          statusBadge.textContent = 'Version stable';
          statusMeta.textContent = 'DÉPLOIEMENT RÉEL';
          envName.textContent = 'stable';
        }
      })();
    </script>
  </body>
</html>
